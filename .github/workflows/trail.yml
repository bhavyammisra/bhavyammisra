name: Contribution trail

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  trail:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/trail-dark.svg?color_snake=#F4C95D&color_dots=#123447,#1E4A5B,#2A6274,#5FA8A8,#9CC3C9&color_dot_border=#0E2A3B&color_background=#0E2A3B
            dist/trail-light.svg?color_snake=#E5446D&color_dots=#E6EEF0,#B9D5D9,#7FB3B8,#2A6274,#0E2A3B
      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
