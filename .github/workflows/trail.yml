name: Contribution trail

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  trail:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/trail-dark.svg?color_snake=#C9A45C&color_dots=#4A1420,#6E2A36,#8E4A4F,#B98A6E,#E8C987&color_dot_border=#3B0D16&color_background=#3B0D16
            dist/trail-light.svg?color_snake=#C9A45C&color_dots=#F3E9DC,#E3C9B8,#C98F86,#8E3A46,#3B0D16
      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
