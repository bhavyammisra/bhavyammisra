name: Contribution trail

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  trail:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/trail-dark.svg?color_snake=#C9A45C&color_dots=#25180F,#3A281B,#5A4129,#8C6B3F,#C9A45C&color_dot_border=#1C120B&color_background=#1C120B
            dist/trail-light.svg?color_snake=#C9A45C&color_dots=#EFE2C8,#D9C29A,#B08A55,#6B4C2C,#2A1B12
      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
