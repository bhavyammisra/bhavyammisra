name: Contribution trail

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  trail:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/trail-dark.svg?color_snake=#C9A45C&color_dots=#360B15,#5A1D2A,#7E3340,#A8705A,#E8C987&color_dot_border=#2B0810&color_background=#2B0810
            dist/trail-light.svg?color_snake=#C9A45C&color_dots=#F3E9DC,#E3C9B8,#C98F86,#7A2333,#2B0810
      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
